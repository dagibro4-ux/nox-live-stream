<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>የእኔ Live Streaming</title>
    <!-- የቪዲዮ ማጫወቻው ዲዛይን -->
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
</head>
<body>
    <header>
        <h1>ቀጥታ ስርጭት (Live Stream)</h1>
    </header>

    <main>
        <!-- እዚህ ጋር ነው ቪዲዮው የሚጫወተው -->
        <video-js id="my-live-player" class="vjs-default-skin" controls preload="auto" width="640" height="360">
            <!-- የሰርቨሩ ማገናኛ (ይህ የሚሰራው ሰርቨሩ ሲሰራ ብቻ ነው) -->
            <source src="http://localhost:8000/live/test/index.m3u8" type="application/x-mpegURL">
        </video-js>
    </main>

    <!-- የቪዲዮ ማጫወቻው ሎጂክ -->
    <script src="https://vjs.zencdn.net/8.3.0/video.js"></script>
    <script>
        var player = videojs('my-live-player');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Kick Clone</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<h2>Kick Clone</h2>
</div>


<nav>

<a href="index.html">Home</a>

<a href="login.html">Login</a>

</nav>

</header>



<section class="auth-container">


<div class="auth-box">


<h2>Create Account</h2>


<form id="registerForm">


<input
type="text"
id="username"
placeholder="Username"
required
>


<input
type="email"
id="email"
placeholder="Email Address"
required
>


<input
type="password"
id="password"
placeholder="Password"
required
>


<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required
>



<select id="role">

<option value="viewer">
Viewer
</option>

<option value="streamer">
Streamer
</option>

</select>



<button type="submit">
Register
</button>


</form>



<p>
Already have an account?
<a href="login.html">
Login
</a>
</p>


</div>


</section>



<script src="js/app.js"></script>

<script src="js/auth.js"></script>


</body>

</html>
